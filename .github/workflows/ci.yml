name: CI

on:
  pull_request:
    branches: [development]
  push:
    branches: [development]

jobs:
  test:
    name: Unit tests (required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  typecheck:
    # Non-blocking until the pre-existing tsc baseline is fixed (backlog P0.1b:
    # ~29 errors across 14 files). Flip continue-on-error off once clean.
    name: Typecheck (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  lint:
    # Non-blocking until the pre-existing lint baseline is fixed (backlog
    # P0.1b: 8 errors). Flip continue-on-error off once clean.
    name: Lint (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
